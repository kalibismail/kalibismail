<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
<style>
.k{font:600 13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:4px;fill:#f0705a}
.n{font:700 76px Georgia,'Times New Roman',serif;fill:#f6ecdd}
.t{font:400 21px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e9dcc6}
.f{opacity:0;animation:in .9s ease-out forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cube{transform-origin:990px 150px;animation:spin 9s ease-in-out infinite}
@keyframes spin{0%,20%{transform:rotate(0)}30%,50%{transform:rotate(90deg)}60%,80%{transform:rotate(180deg)}90%,100%{transform:rotate(360deg)}}
.s{stroke:#2a2530;stroke-width:3}
.blink{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
</style>
</defs>
<rect width="1200" height="300" rx="18" fill="#2a2530"/>
<g class="f d1"><text x="64" y="96" class="k">SOFTWARE DEVELOPER</text></g>
<g class="f d2"><text x="60" y="176" class="n">Kalib Ismail</text></g>
<g class="f d3"><text x="64" y="224" class="t">I build 3D tools for the browser, and the geometry and</text><text x="64" y="252" class="t">shaders underneath them.<tspan class="blink" fill="#f0705a"> ▍</tspan></text></g>
<g class="cube">
<g transform="translate(990 150)">
<polygon class="s" points="0,-90 78,-45 0,0 -78,-45" fill="#f6ecdd"/>
<polygon class="s" points="-78,-45 0,0 0,90 -78,45" fill="#f2a541"/>
<polygon class="s" points="78,-45 0,0 0,90 78,45" fill="#4f8a5b"/>
<g stroke="#2a2530" stroke-width="3" fill="none">
<path d="M26,-75 L-52,-30 M52,-60 L-26,-15 M-26,-75 L52,-30 M-52,-60 L26,-15"/>
<path d="M-78,-15 L0,30 M-78,15 L0,60 M-52,-30 L-52,60 M-26,-15 L-26,75"/>
<path d="M78,-15 L0,30 M78,15 L0,60 M52,-30 L52,60 M26,-15 L26,75"/>
</g>
</g>
</g>
</svg>
